name = "lean-galois-solvability"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Galois"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Galois"
globs = ["Galois", "Galois.+"]